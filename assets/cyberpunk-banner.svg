<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">lechan775 animated cyberpunk banner</title>
  <desc id="desc">Animated neon grid, data rain, circuit lines, and profile title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.45" stop-color="#10172F"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="neon" x1="90" y1="30" x2="1080" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF"/>
      <stop offset="0.5" stop-color="#FF2BD6"/>
      <stop offset="1" stop-color="#D7FF38"/>
    </linearGradient>
    <linearGradient id="gridLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5FF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.00 0 0 0 0 0.96 0 0 0 0 1.00 0 0 0 0.95 0" result="cyan"/>
      <feMerge>
        <feMergeNode in="cyan"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 1.00 0 0 0 0 0.17 0 0 0 0 0.84 0 0 0 0.9 0" result="pink"/>
      <feMerge>
        <feMergeNode in="pink"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="microgrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#00F5FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      @keyframes drift { from { transform: translateY(-230px); } to { transform: translateY(390px); } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes scan { from { transform: translateX(-340px); } to { transform: translateX(1240px); } }
      @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes dash { to { stroke-dashoffset: -420; } }
      @keyframes glitch { 0%, 92%, 100% { transform: translate(0,0); opacity: .85; } 94% { transform: translate(10px,-3px); opacity: 1; } 96% { transform: translate(-8px,4px); opacity: .75; } }
      .rain { animation: drift 5.8s linear infinite; }
      .rain2 { animation: drift 7.4s linear infinite; animation-delay: -2.6s; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .scan { animation: scan 3.8s ease-in-out infinite; }
      .ring { transform-origin: 910px 180px; animation: rotate 18s linear infinite; }
      .ring2 { transform-origin: 910px 180px; animation: rotate 11s linear infinite reverse; }
      .dash { stroke-dasharray: 14 18; animation: dash 6s linear infinite; }
      .glitch { animation: glitch 3.1s steps(2,end) infinite; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#microgrid)"/>

  <g opacity="0.38">
    <path d="M0 300H1200" stroke="url(#gridLine)" stroke-width="1"/>
    <path d="M50 340L250 218H950L1150 340" stroke="#00F5FF" stroke-opacity="0.28"/>
    <path d="M130 340L315 230H885L1070 340" stroke="#FF2BD6" stroke-opacity="0.22"/>
    <path d="M240 340L390 246H810L960 340" stroke="#D7FF38" stroke-opacity="0.16"/>
    <g class="dash" stroke="#00F5FF" stroke-opacity="0.2">
      <path d="M0 330H1200"/>
      <path d="M0 270H1200"/>
      <path d="M0 220H1200"/>
    </g>
  </g>

  <g class="rain" opacity="0.58" filter="url(#glow)">
    <text class="mono" x="78" y="20" fill="#00F5FF" font-size="16">010101</text>
    <text class="mono" x="154" y="88" fill="#FF2BD6" font-size="14">AI-CV</text>
    <text class="mono" x="246" y="42" fill="#00F5FF" font-size="15">POSE</text>
    <text class="mono" x="360" y="116" fill="#D7FF38" font-size="13">MCP</text>
    <text class="mono" x="506" y="72" fill="#00F5FF" font-size="15">AGENT</text>
    <text class="mono" x="650" y="35" fill="#FF2BD6" font-size="14">STARNET</text>
    <text class="mono" x="760" y="124" fill="#00F5FF" font-size="13">ONNX</text>
    <text class="mono" x="1014" y="58" fill="#D7FF38" font-size="15">BUILD</text>
  </g>
  <g class="rain2" opacity="0.44" filter="url(#pinkGlow)">
    <text class="mono" x="28" y="-38" fill="#FF2BD6" font-size="14">VISION</text>
    <text class="mono" x="210" y="-12" fill="#00F5FF" font-size="12">PYTORCH</text>
    <text class="mono" x="442" y="-70" fill="#D7FF38" font-size="13">HARMONY</text>
    <text class="mono" x="590" y="-24" fill="#FF2BD6" font-size="14">REPO</text>
    <text class="mono" x="824" y="-50" fill="#00F5FF" font-size="13">NEON</text>
    <text class="mono" x="1060" y="-18" fill="#FF2BD6" font-size="14">775</text>
  </g>

  <g transform="translate(64 70)">
    <rect x="0" y="0" width="610" height="178" rx="18" fill="#050816" fill-opacity="0.62" stroke="url(#neon)" stroke-width="2"/>
    <rect x="18" y="20" width="120" height="8" rx="4" fill="#00F5FF" opacity="0.85" class="pulse"/>
    <rect x="150" y="20" width="56" height="8" rx="4" fill="#FF2BD6" opacity="0.78"/>
    <rect x="218" y="20" width="84" height="8" rx="4" fill="#D7FF38" opacity="0.72"/>
    <text class="mono glitch" x="24" y="94" fill="#E6F7FF" font-size="58" font-weight="800" letter-spacing="3">LECHAN775</text>
    <text class="mono" x="27" y="128" fill="#00F5FF" font-size="18" font-weight="700">CV RESEARCH // AI INFRA // FULL-STACK</text>
    <text class="mono" x="27" y="154" fill="#A7B6C8" font-size="13">github.com/lechan775  ::  signal locked  ::  neon build active</text>
  </g>

  <g transform="translate(910 180)">
    <circle r="92" fill="#00F5FF" fill-opacity="0.06" stroke="#00F5FF" stroke-opacity="0.45" filter="url(#glow)" class="ring"/>
    <ellipse rx="128" ry="40" stroke="#FF2BD6" stroke-opacity="0.55" stroke-width="2" filter="url(#pinkGlow)" class="ring2"/>
    <ellipse rx="42" ry="128" stroke="#00F5FF" stroke-opacity="0.4" stroke-width="2" filter="url(#glow)" class="ring"/>
    <circle r="32" fill="#050816" stroke="url(#neon)" stroke-width="3" filter="url(#glow)" class="pulse"/>
    <circle r="9" fill="#D7FF38" filter="url(#glow)"/>
  </g>

  <g opacity="0.78">
    <path d="M704 86H812L852 126H932" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" class="dash"/>
    <path d="M700 272H812L854 238H1058" stroke="#FF2BD6" stroke-width="2" stroke-linecap="round" class="dash"/>
    <path d="M1042 92H1130" stroke="#D7FF38" stroke-width="2" stroke-linecap="round" class="dash"/>
    <circle cx="812" cy="86" r="5" fill="#00F5FF" class="pulse"/>
    <circle cx="1058" cy="272" r="5" fill="#FF2BD6" class="pulse"/>
    <circle cx="1130" cy="92" r="5" fill="#D7FF38" class="pulse"/>
  </g>

  <rect class="scan" x="-240" y="0" width="180" height="360" fill="#00F5FF" opacity="0.08"/>
  <rect x="0" y="0" width="1200" height="360" rx="28" stroke="url(#neon)" stroke-width="2" opacity="0.85"/>
</svg>
